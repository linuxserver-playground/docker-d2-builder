# The manifest for docker-d2-builder. Schema: https://github.com/linuxserver-playground/builder/blob/main/schemas/image.schema.json
schema: 1
name: d2-builder
kind: tool

summary: d2-builder container image.

upstream:
  version:
    type: github_release
    repo: d2lang/d2
    require_assets:
      - asset: '^d2\-.*\-linux\-amd64\.tar\.gz$'
      - asset: '^d2\-.*\-linux\-arm64\.tar\.gz$'
  notes:
    type: github_release
    repo: d2lang/d2

release:
  branch: main
  tag: latest
  channel: stable

build:
  base: alpine
  version_arg: D2_VERSION
  platforms:
  - amd64
  - arm64

test:
  enabled: false
  startup_timeout: 60

runtime: {}

docs:
  categories:
  - Internal
  custom_readme: |
    # linuxserver/d2-builder

    Expects to run as part of the LSIO CI process. Not for public consumption.

    ## Running against local project

    If you need to test functionality just run:

    ```bash
    docker pull lscr.io/linuxserver/d2-builder:latest && \
    docker run -d --rm -v /tmp/d2:/output -e PUID=1000 -e PGID=1000 lscr.io/linuxserver/d2-builder:latest mastodon:latest
    ```

    Generated svg files will be created in `/output`.

    ## Versions

    The following line is only in this repo for loop testing:

    - { date: "01.01.50:", desc: "I am the release message for this internal repo." }

publish:
  stores:
    unraid: false
